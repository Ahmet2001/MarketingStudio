<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketingStudio Viewer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <strong class="brand">MarketingStudio</strong>
  <nav id="views"><button data-view="workflows" class="on">Workflows</button><button data-view="capabilities">Capabilities</button></nav>
  <span id="root"></span>
  <button id="reload" title="Read the files again">Reload</button>
</header>
<main>
  <aside id="list"><input id="search" placeholder="Search…"><div id="items"></div></aside>
  <section id="detail"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
