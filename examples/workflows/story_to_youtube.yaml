# Generate a story video, then upload it. The upload needs approval.
spec_version: "0.1"
workflow:
  id: story_to_youtube
  name: Story to YouTube
  version: 0.1.0
  inputs:
    topic: {type: text, required: true}
    title: {type: text, required: true}
  steps:
    - id: story
      capability: story.video.generate
      with: {topic: "{{ inputs.topic }}", video_game_mode: true}
    - id: upload
      capability: social.publish.youtube_video
      with:
        video_path: "{{ steps.story.outputs.video }}"
        title: "{{ inputs.title }}"
  outputs:
    result: "{{ steps.upload.outputs.result }}"
